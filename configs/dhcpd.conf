# ==============================================================================
# ISC-DHCP Server Configuration
# File: /etc/dhcp/dhcpd.conf
# Author: Md. Mahamudul Hasan (Support Engineer - ISP Software & Networking)
# ==============================================================================

default-lease-time 43200; # 12 Hours
max-lease-time 86400;     # 24 Hours
authoritative;
log-facility local7;

# Corporate Staff Subnet
subnet 192.168.20.0 netmask 255.255.255.0 {
    range 192.168.20.50 192.168.20.250;
    option routers 192.168.20.1;
    option subnet-mask 255.255.255.0;
    option domain-name "asiannet.internal";
    option domain-name-servers 192.168.30.10, 8.8.8.8;
    option ntp-servers 192.168.30.10;
}

# Fixed Static MAC Reservations (Printers & Core Services)
host network_printer_marketing {
    hardware ethernet 00:11:22:33:44:55;
    fixed-address 192.168.20.20;
}

host voip_pbx_gateway {
    hardware ethernet 08:00:27:12:34:56;
    fixed-address 192.168.20.22;
}

